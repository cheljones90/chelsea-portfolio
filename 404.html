<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Chelsea Jones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Geist:wght@300;400&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:  #F5F2EE;
  --cream-2:#EDE9E3;
  --ink:    #16140F;
  --ink-2:  #4A4740;
  --ink-3:  #8C8880;
  --steel:  #3D6B8A;
  --border: rgba(22,20,15,0.08);
  --border-2:rgba(22,20,15,0.15);
  --serif:  'Cormorant Garamond', Georgia, serif;
  --sans:   'Geist', system-ui, sans-serif;
  --mono:   'Geist Mono', monospace;
}
html,body{
  height:100%;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:48px 24px;
  position:relative;
}

/* ── Ghost target rings ─────────────────────────────── */
.target{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  user-select:none;
}
.ring{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid var(--border);
}
.ring-1{width:640px;height:640px;}
.ring-2{width:480px;height:480px;}
.ring-3{width:320px;height:320px;}
.ring-4{width:160px;height:160px;}
.ring-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:24px;height:24px;border-radius:50%;
  border:1px solid var(--border-2);
}

/* Arrow SVG ─────────────────────────────────────────── */
.arrow-wrap{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%, -50%) rotate(-38deg) translate(80px, -120px);
  opacity:0;
  animation:arrowLand 0.6s 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes arrowLand{
  from{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) translate(80px,-180px);}
  to{opacity:1;transform:translate(-50%,-50%) rotate(-38deg) translate(80px,-120px);}
}

/* ── Content ─────────────────────────────────────────── */
.content{
  position:relative;z-index:2;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:0;
  opacity:0;
  animation:fadeUp 0.9s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:20px;
}
.four-oh-four{
  font-family:var(--serif);
  font-size:clamp(96px,16vw,180px);
  font-weight:300;line-height:0.9;
  letter-spacing:-0.04em;
  color:var(--ink);
  margin-bottom:24px;
}
.four-oh-four em{font-style:italic;color:var(--steel);}

.message{
  font-size:15px;font-weight:300;
  color:var(--ink-2);line-height:1.7;
  max-width:360px;margin-bottom:40px;
}

.home-link{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--border-2);padding-bottom:4px;
  transition:color 0.2s,border-color 0.2s;
}
.home-link:hover{color:var(--steel);border-color:var(--steel);}
.home-link svg{transition:transform 0.2s;}
.home-link:hover svg{transform:translateX(3px);}

/* ── Nav mark ─────────────────────────────────────────── */
.nav-mark{
  position:fixed;top:28px;left:56px;
  font-family:var(--serif);font-size:22px;font-weight:400;
  color:var(--ink);text-decoration:none;letter-spacing:-0.01em;
  z-index:10;
}
.nav-mark span{color:var(--steel);}

@media(max-width:768px){
  .ring-1{width:360px;height:360px;}
  .ring-2{width:270px;height:270px;}
  .ring-3{width:180px;height:180px;}
  .ring-4{width:90px;height:90px;}
  .nav-mark{left:24px;top:20px;}
}
</style>
</head>
<body>

<a href="/" class="nav-mark">Chelsea<span>.</span></a>

<!-- Target rings -->
<div class="target">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="ring-center"></div>

  <!-- Arrow -->
  <div class="arrow-wrap">
    <svg width="6" height="120" viewBox="0 0 6 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Shaft -->
      <line x1="3" y1="110" x2="3" y2="20" stroke="#3D6B8A" stroke-width="1.5"/>
      <!-- Nock -->
      <line x1="1" y1="110" x2="3" y2="104" stroke="#3D6B8A" stroke-width="1"/>
      <line x1="5" y1="110" x2="3" y2="104" stroke="#3D6B8A" stroke-width="1"/>
      <!-- Fletchings -->
      <path d="M3 90 C0 82 0 76 3 72" stroke="#8C8880" stroke-width="1" fill="none"/>
      <path d="M3 90 C6 82 6 76 3 72" stroke="#8C8880" stroke-width="1" fill="none"/>
      <!-- Point -->
      <path d="M1.5 20 L3 8 L4.5 20 Z" fill="#3D6B8A"/>
    </svg>
  </div>
</div>

<!-- Content -->
<div class="content">
  <p class="eyebrow">Error 404</p>
  <div class="four-oh-four">4<em>0</em>4</div>
  <p class="message">Close shot, but this page doesn't exist. Looks like that arrow landed just off the mark.</p>
  <a href="/" class="home-link">
    Back to home
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M1.5 6h9M6 1.5l4.5 4.5L6 10.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</div>

</body>
</html>
